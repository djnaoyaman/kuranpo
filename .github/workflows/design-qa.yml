name: Design preservation and responsive QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p "test_sitemap.py"
      - run: python3 tests/preservation.py
      - run: node --check assets/monochrome.js
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:responsive
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-browser-report
          path: |
            playwright-report/
            test-results/
