<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fff"/><g fill="#111" font-family="Noto Sans CJK JP, sans-serif"><text x="56" y="64" font-size="34" font-weight="700">鎌・くらんぽ</text><text x="480" y="62" font-size="22" font-weight="400">人物相関図</text><path d="M444 0V630 M0 106H1200 M0 550H1200" fill="none" stroke="#111" stroke-width="1"/><rect x="440" y="102" width="8" height="8"/><rect x="440" y="546" width="8" height="8"/><text x="56" y="215" font-size="54" font-weight="900">鎌倉を</text><text x="92" y="292" font-size="54" font-weight="900">歩く。</text><text x="56" y="369" font-size="54" font-weight="900">読む、</text><text x="92" y="446" font-size="54" font-weight="900">確かめる。</text><text x="480" y="230" font-size="64" font-weight="900">鎌倉の人物と</text><text x="480" y="316" font-size="64" font-weight="900">つながり</text><text x="484" y="438" font-size="28" font-weight="400">将軍・執権・僧たち。</text><text x="484" y="477" font-size="28" font-weight="400">役割と親族関係を整理する。</text><text x="56" y="597" font-size="21" font-weight="400">KAMAKURA + SANPO</text><text x="480" y="597" font-size="24" font-weight="400">歩く前に、歴史の要点を。</text></g></svg>