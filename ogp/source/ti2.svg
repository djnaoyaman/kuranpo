<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#fafaf8"/><g fill="#111" font-family="Noto Sans CJK JP, sans-serif"><text x="80" y="68" font-size="19" font-weight="400" letter-spacing="2.6" text-anchor="start">KAMAKURA / WALKING NOTES</text><text x="1120" y="68" font-size="25" font-weight="700" letter-spacing="0" text-anchor="end">鎌・くらんぽ</text><path d="M80 145H111" stroke="#111" stroke-width="3"/><text x="130" y="153" font-size="21" font-weight="400" letter-spacing="2" text-anchor="start">年表でめぐる</text><text x="75" y="270" font-size="89" font-weight="900" letter-spacing="-3" text-anchor="start">頼朝の時代を</text><text x="75" y="378" font-size="89" font-weight="900" letter-spacing="-3" text-anchor="start">歩いて知る</text><text x="80" y="454" font-size="28" font-weight="400" letter-spacing="1" text-anchor="start">八幡宮と、政治・祈りの跡地。</text><text x="80" y="496" font-size="28" font-weight="400" letter-spacing="1" text-anchor="start">幕府が形になる時代をたどる。</text><path d="M80 550H1120" stroke="#111" stroke-width="1"/><text x="80" y="594" font-size="18" font-weight="400" letter-spacing="2" text-anchor="start">TI2</text><text x="1120" y="594" font-size="20" font-weight="400" letter-spacing="1" text-anchor="end">鎌倉を歩く、歴史を読む。</text></g></svg>