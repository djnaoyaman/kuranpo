name: Auto-generate sitemap.xml

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sitemap.xml'
  workflow_dispatch: {}

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate sitemap.xml
        run: python3 scripts/generate_sitemap.py

      - name: Commit sitemap.xml if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- sitemap.xml; then
            git add sitemap.xml
            git commit -m "chore: auto-update sitemap.xml [skip ci]"
            git push
          else
            echo "sitemap.xml unchanged, nothing to commit"
          fi
